<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clé Évolud</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef1f6;color:#1d2433;margin:0;padding:30px 16px}
.c{max-width:640px;margin:0 auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{margin:0 0 6px;color:#23355f;font-size:22px}
p{color:#6b7385;font-size:14px}
textarea{width:100%;box-sizing:border-box;font:15px ui-monospace,Consolas,monospace;padding:12px;border:2px solid #2a4b9b;border-radius:10px;min-height:80px;word-break:break-all}
button{margin-top:12px;width:100%;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700;background:#2a4b9b;color:#fff;cursor:pointer}
.ok{color:#2e7d32;font-weight:700;text-align:center;min-height:20px}
small{display:block;text-align:center;color:#6b7385;margin-top:18px}
</style>
</head>
<body>
<div class="c">
  <h1>🔑 Clé de l'appli Évolud</h1>
  <p>Cette page affiche la clé enregistrée <b>sur cet ordinateur uniquement</b>. Clique sur « Copier », puis colle-la dans la conversation avec Claude. Supprime ensuite ce fichier (cle.html) du dépôt GitHub.</p>
  <textarea id="k" readonly></textarea>
  <button id="b">📋 Copier la clé</button>
  <div class="ok" id="m"></div>
  <small>Fait par Saïd OUFQIR</small>
</div>
<script>
var k = null; try { k = localStorage.getItem('evolud_k'); } catch (e) {}
var t = document.getElementById('k'), m = document.getElementById('m');
t.value = k || 'Aucune clé trouvée sur cet appareil : ouvre cette page dans le navigateur où l’appli Évolud fonctionne.';
document.getElementById('b').onclick = function () {
  t.focus(); t.select();
  var ok = function () { m.textContent = '✅ Clé copiée : colle-la dans Claude (Ctrl + V)'; };
  try { navigator.clipboard.writeText(t.value).then(ok, function () { document.execCommand('copy'); ok(); }); } catch (e) { document.execCommand('copy'); ok(); }
};
</script>
</body>
</html>
