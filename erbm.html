<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2a44">
<title>Évolud · ERBM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de chantier, net et direct, lisible sur téléphone en plein soleil
   IDEA: le plan de cité minière — chaque maison est une tuile de brique qui fonce à mesure que les travaux avancent
   PICTURE: la carte de la cité en haut du tableau de bord, une tuile par logement
   COLOUR and TYPE: blanc, encre charbon, brique rouge du bassin minier, ardoise pour le terminé ; Archivo + Inter
   LAYOUT: barre d'onglets (en bas sur téléphone), listes en une colonne, fiche logement en panneau plein écran */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141518);--bg2:light-dark(#f4f2ef,#1d1f23);--ink:light-dark(#1b1d22,#eceae6);--mute:light-dark(#686a70,#a3a4a8);--line:light-dark(#e2dfda,#2e3036);--brick:light-dark(#c95f12,#f08a3c);--brick2:light-dark(#fbe3d0,#4a2c18);--slate:light-dark(#0f2a44,#7fa6cf);--warn:light-dark(#9a5b00,#f0b45a);--card:light-dark(#fff,#191a1e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px);font-weight:800}h2{font-size:21px;font-weight:700}h3{font-size:17px;font-weight:700}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:18px max(4vw,16px) 10px;border-bottom:1px solid var(--line)}
header .sub{color:var(--mute);font-size:14px}
nav{display:flex;gap:4px;padding:0 max(4vw,16px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
nav a{flex:none;padding:12px 14px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav a.on{color:var(--ink);border-color:var(--brick)}
main{padding:20px max(4vw,16px) 100px;max-width:1240px;margin:0 auto}
.note{background:var(--bg2);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--mute);margin-bottom:16px}
.note.warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0 24px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:800 clamp(26px,5vw,34px)/1 Archivo,sans-serif}
.kpi span{font-size:13px;color:var(--mute)}
.cite{margin-bottom:18px}
.cite h3{margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1/1.05;border:0;border-radius:4px 4px 3px 3px;font:700 13px Archivo,sans-serif;cursor:pointer;color:#fff;padding:0;clip-path:polygon(0 28%,50% 0,100% 28%,100% 100%,0 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
.tile i{font-style:normal;font-size:10px;font-weight:500;opacity:.85}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);margin:6px 0 20px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px}
.bars .row{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 2.5em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bars .track{height:12px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--brick);border-radius:6px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item:hover{border-color:var(--brick)}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mute)}
.badge{display:inline-block;font:700 12px Archivo,sans-serif;padding:3px 8px;border-radius:20px;background:var(--brick2);color:var(--brick);white-space:nowrap}
.badge.gr{background:light-dark(#dfeeee,#1f3536);color:var(--slate)}
.badge.ok{background:var(--slate);color:#fff}.badge.late{background:var(--warn);color:#fff}
.prog{width:56px;height:56px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--brick);outline-offset:1px}
.tools input{flex:1 1 200px;width:auto}.tools select{flex:0 1 190px;width:auto}
button.b{font:600 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.p{background:var(--brick);border-color:var(--brick);color:#fff}
button.d{color:var(--brick)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 14px}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}
label>input,label>select,label>textarea{margin-top:4px}
.sheet{position:fixed;inset:0;background:rgb(0 0 0/.4);z-index:20;display:none;justify-content:flex-end}
.sheet.on{display:flex}
.panel{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;padding:0 0 60px}
.panel .top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;z-index:2}
.panel .top h2{flex:1}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec h3{margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:6px 0}
.steps .ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;font:700 14px Archivo;color:#fff;padding:0}
.steps li.done .ck{background:var(--slate);border-color:var(--slate)}
.steps li.cur .ck{border-color:var(--brick)}
.steps li.cur span{font-weight:700}
.steps input{min-height:38px;padding:6px 8px;font-size:15px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px}
.lot{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--bg);font:15px Inter;color:var(--ink);text-align:left;min-height:44px}
.lot em{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--bg2);color:var(--mute);white-space:nowrap}
.lot.s1 em{background:var(--brick2);color:var(--brick)}.lot.s2 em{background:var(--slate);color:#fff}
.lot.s3{opacity:.45}
.res{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
.res.lev{opacity:.6}.res img{max-width:160px;border-radius:8px;grid-column:1/-1}
.ft{border-collapse:collapse;width:100%;font-size:14px}.ft th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}.ft td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}.ft td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.ft input{width:80px;min-height:38px;padding:6px}.ft .b{min-height:36px;padding:0 10px}.scroll{overflow-x:auto}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500;min-height:44px}.chk input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--brick)}
.cklot{font-size:15px;margin:16px 0 6px;color:var(--brick)}
.ck{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}.ck.on{border-color:var(--brick);background:color-mix(in srgb,var(--brick2) 35%,var(--bg))}
.ckh{display:flex;justify-content:space-between;align-items:center;gap:10px}.ckh>span:first-child{font-size:15px}
.yn{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}.yn button{border:0;background:var(--bg);color:var(--ink);font:600 14px Inter;min-height:40px;min-width:52px;cursor:pointer}.yn button+button{border-left:1px solid var(--line)}.yn button.sel{background:var(--brick);color:#fff}.yn button.sel[data-ckon$="|0"]{background:var(--mute)}
.ckb{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-top:8px}.ckb input{min-height:40px;padding:6px 10px}.ckimg{max-width:120px;border-radius:8px;margin:6px 6px 0 0}
.pvc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.res.pv{grid-template-columns:minmax(0,1fr) auto}@media(max-width:600px){.res.pv{grid-template-columns:1fr}.pvc{justify-content:flex-start}}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.dlg{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
.dlg.on{display:flex}.dlg>div{background:var(--bg);border-radius:14px;padding:18px;max-width:420px;width:100%}
.dlg p{margin:0 0 14px}
@media(max-width:600px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom)}nav a{padding:12px 4px;font-size:12px;border-bottom:0;border-top:3px solid transparent}nav a.on{border-color:var(--brick)}.steps li{grid-template-columns:32px minmax(0,1fr);}.steps li input{grid-column:2}.prog{width:44px;height:44px}}
@media(max-width:600px){.item.tr{grid-template-columns:auto minmax(0,1fr)}.item.tr>span:last-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header><h1 id="titre">ERBM</h1><span class="sub" id="soustitre">Réhabilitation de cités minières</span><span class="sub" id="syncst" style="margin-left:auto"></span><button class="b" data-act="sync" style="min-height:36px">⟳ Synchro</button></header>
<nav id="nav">
<a href="#tableau" data-v="tableau">Tableau de bord</a>
<a href="#logements" data-v="logements">Logements</a>
<a href="#tiroirs" data-v="tiroirs">Tiroirs</a>
<a href="#reserves" data-v="reserves">Réserves</a>
<a href="#reglages" data-v="reglages">Réglages</a>
</nav>
<main id="main"><p class="empty">Chargement des données du chantier…</p></main>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="dlg" id="dlg"><div><p id="dlgTxt"></p><div class="tools" style="margin:0;justify-content:flex-end"><button class="b" id="dlgNo">Annuler</button><button class="b p" id="dlgOk">Confirmer</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
{
const P={
 GR:{nom:'GR · site occupé',court:'GR',etapes:['VTE','RDV locataire calé','Travaux en cours','Travaux terminés','VTS / réception','Réserves levées'],
  lots:['Menuiseries ext. (fenêtres)',"Porte d'entrée",'VMC','Chauffage / chaudière','Électricité (mise en sécurité)','Isolation combles','Sanitaires','Peinture / finitions']},
 TIR:{nom:'Opération tiroir',court:'Tiroir',etapes:['VTE','Tiroir attribué','Déménagement aller','EDL de sortie','Curage','Travaux TCE','VTS / réception','Réserves levées','Retour locataire'],
  lots:['Curage / démolition','Gros œuvre / maçonnerie','Couverture / zinguerie','Menuiseries extérieures','Isolation / plâtrerie','Électricité','Plomberie / sanitaires','Chauffage / VMC','Menuiseries intérieures','Revêtements de sol','Peinture','Façade / ravalement','Extérieurs / VRD']}
};
const LOTST=['À faire','En cours','Fait','Non prévu'];
const S={logs:{},tirs:{},cfg:{},bpu:[],view:'tableau',open:null,q:'',fp:'',fe:'',fc:''};
let readonly=false;
/* ---------- stockage local + synchro serveur Évolud (action « erbm ») ---------- */
const LSK='evolud_erbm_v1',ME='erbm';
let SY={dirty:{},since:0,conf:{},bc:{},dead:{},cfgU:0,bpuU:0,last:0,err:''};
const blob=id=>id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600':'';
const driveLink=id=>'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view';
function dl(filename,data){try{const b=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}catch(e){return false}}
const downloads={save:async({filename,data})=>{if(!dl(filename,data))throw {code:'unavailable'};return {status:'saved'}}};
function toJpeg(file,max=1600){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82).split(',')[1])};im.onerror=ko;im.src=fr.result};fr.onerror=ko;fr.readAsDataURL(file)})}
const assets={upload:async(file)=>{const l=S.open&&S.logs[S.open];const b64=await toJpeg(file);const ug=String((l&&(l.ug||l.num))||'ERBM');const name='ERBM_'+ug+'_'+Date.now()+'.jpg';const j=await api({action:'photo',ug,name,b64,kind:'ERBM',meta:{adresse:l?l.adresse:'',ts:Date.now(),comment:'ERBM'}});return {id:j.fileId,url:j.url}}};
function conf(){const d=SY.det||{},c=SY.conf||{};return {u:c.u||d.u||'',t:c.t||d.t||'',d:c.d||d.d||SY.dev||'',n:c.n||d.n||''}}
async function api(body){const c=conf();if(!c.u||!c.t)throw new Error('Connexion au serveur non réglée (Réglages)');const r=await fetch(c.u,{method:'POST',body:JSON.stringify(Object.assign({token:c.t,device:c.d,user:c.n?c.n+' (ERBM)':'ERBM'},body))});const j=await r.json();if(!j.ok)throw new Error(j.error||'erreur serveur');return j}
function detect(){
 const out={},seen=new Set();
 const take=(o)=>{const ks=Object.keys(o);let url=null;for(const k of ks){const v=o[k];if(typeof v==='string'&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(v))url=v}
  if(url){if(!out.u)out.u=url;for(const k of ks){const v=o[k];if(typeof v!=='string')continue;if(/^(t|token|cle|clé|key|cleChantier)$/i.test(k)&&!out.t)out.t=v;if(/^(d|device|deviceId|appareil|dev)$/i.test(k)&&!out.d)out.d=v;if(/^(n|user|nom|userName|utilisateur)$/i.test(k)&&!out.n)out.n=v}}
  for(const k of ks){const v=o[k];if(typeof v!=='string'||v.length>120)continue;if(/^(token|cle|clé|cleChantier)$/i.test(k)&&!out.t)out.t=v;if(/^(device|deviceId|appareil)$/i.test(k)&&!out.d)out.d=v}};
 const visit=(o,d)=>{if(o==null||d>6)return;if(typeof o==='string'){if(!out.u){const m=o.match(/https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/);if(m)out.u=m[0]}if(o.length<300000&&(o[0]==='{'||o[0]==='[')){try{visit(JSON.parse(o),d+1)}catch(e){}}return}
  if(typeof o!=='object'||seen.has(o))return;seen.add(o);try{take(o)}catch(e){}let n=0;for(const k of Object.keys(o)){if(++n>400)break;visit(o[k],d+1)}};
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k==='evolud_k'||k===LSK)continue;const v=localStorage.getItem(k);if(/token|cle|clé/i.test(k)&&v&&v.length<120&&!out.t&&v[0]!=='{')out.t=v;if(/device|appareil/i.test(k)&&v&&v.length<120&&!out.d&&v[0]!=='{')out.d=v;visit(v,0)}}catch(e){}
 try{if(window.parent&&window.parent!==window&&window.parent.__EVG)visit(window.parent.__EVG,0)}catch(e){}
 return out}
let syncing=false,again=false,syncT=null;
function sched(ms=1500){clearTimeout(syncT);syncT=setTimeout(sync,ms)}
function setSt(){const e=$('syncst');if(!e)return;const n=Object.keys(SY.dirty).length;e.textContent=SY.err?('⚠ '+SY.err):(syncing?'Synchro…':(n?n+' en attente':(SY.last?'✓ '+new Date(SY.last).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')));e.style.color=SY.err?'var(--warn)':'var(--mute)'}
const typing=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file'};
function recOf(key){
 const [k,id]=[key.slice(0,1),key.slice(2)];
 if(k==='L'||k==='T'){const store=k==='L'?S.logs:S.tirs,o=store[id];
  if(!o){const ts=SY.dead[key];return ts?[{c:ME,id:key,updatedAt:ts,data:{id:key,type:k==='L'?'logement':'tiroir',deleted:true,updatedAt:ts}}]:[]}
  const u=o._u||Date.now(),d={id:key,type:k==='L'?'logement':'tiroir',updatedAt:u,v:o};
  if(k==='L'){d.ug=o.ug||'';d.adresse=o.adresse||'';d.cite=o.cite||'';d.parcours=(P[o.parcours]||{}).court||'';d.etape=etat(o);d.montant=Math.round(montant(o)*100)/100}else{d.adresse=(o.num?'N° '+o.num+' ':'')+(o.adresse||'')}
  return [{c:ME,id:key,updatedAt:u,data:d}]}
 if(key==='C:cfg')return [{c:ME,id:key,updatedAt:SY.cfgU||Date.now(),data:{id:key,type:'config',updatedAt:SY.cfgU||Date.now(),v:S.cfg}}];
 if(key==='B:bpu'){const U=SY.bpuU||Date.now(),N=250,n=Math.max(1,Math.ceil(S.bpu.length/N)),out=[];for(let i=0;i<Math.max(n,SY.bpuN||0);i++){const id='B:'+i;out.push({c:ME,id,updatedAt:U,data:{id,type:'bpu',updatedAt:U,i,n,v:i<n?S.bpu.slice(i*N,i*N+N):[]}})}SY.bpuN=n;return out}
 return []}
function applyRecs(recs){
 let ch=false;
 recs.forEach(r=>{const d=r.data||{},key=String(r.id),k=key.slice(0,1),U=+d.updatedAt||0;
  if(k==='L'||k==='T'){const store=k==='L'?S.logs:S.tirs,id=key.slice(2),loc=store[id];
   if(SY.dirty[key]&&((loc&&(loc._u||0)>U)||(SY.dead[key]||0)>U))return;
   if(d.deleted){if(loc&&(loc._u||0)<=U){delete store[id];ch=true}SY.dead[key]=U;return}
   if(!loc||(loc._u||0)<U||!SY.dirty[key]){if(!loc||(loc._u||0)!==U){store[id]={...d.v,_u:U};ch=true}}}
  else if(key==='C:cfg'){if(U>(SY.cfgU||0)&&!SY.dirty[key]){S.cfg={...(d.v||{})};SY.cfgU=U;ch=true}}
  else if(k==='B'){if(U>(SY.bpuU||0)&&!SY.dirty['B:bpu']){const g=SY.bc[U]||(SY.bc[U]={n:d.n,p:{}});g.p[d.i]=d.v||[]}}});
 Object.keys(SY.bc).map(Number).sort((a,b)=>b-a).forEach(U=>{const g=SY.bc[U];if(U>(SY.bpuU||0)&&Object.keys(g.p).length>=g.n){let all=[];for(let i=0;i<g.n;i++)all=all.concat(g.p[i]||[]);S.bpu=all;SY.bpuU=U;SY.bpuN=g.n;ch=true}});
 Object.keys(SY.bc).forEach(U=>{if(+U<=(SY.bpuU||0))delete SY.bc[U]});
 return ch}
async function sync(){
 if(syncing){again=true;return}
 const c=conf();if(!c.u||!c.t){SY.err='serveur non réglé';setSt();return}
 syncing=true;SY.err='';setSt();

function isMapUG(o){if(!o||typeof o!=='object'||Array.isArray(o))return false;const k=Object.keys(o);let n=0,ok=0;for(let i=0;i<k.length&&n<60;i++)if(/^\d{5,7}$/.test(k[i])){n++;const v=o[k[i]];if(v&&typeof v==='object'&&('forf' in v||'bdc' in v||'ph' in v||'a' in v))ok++}return n>=3&&ok>=2}
function fromParts(parts){const best={};parts.forEach(p=>{const m=/^gammaD(\d+)$/.exec(p.id);if(!m)return;const t=p.updatedAt||0;if(!best[m[1]]||t>=best[m[1]].t)best[m[1]]={t,v:p.deleted?'':(typeof p.v==='string'?p.v:'')}});let s='',i=1;while(best[i]&&best[i].v){s+=best[i].v;i++}if(!s)return null;try{const o=JSON.parse(s);return isMapUG(o)?o:null}catch(e){return null}}
