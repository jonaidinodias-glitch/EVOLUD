.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}

.card h3{font-size:13px;margin:10px 0 6px;color:var(--navy2)}

input,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#fff;max-width:100%}

.mut{color:var(--mut)}.small{font-size:11.5px}

.verdict{font-weight:700;font-size:14px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:1px;font-size:11px;background:#fafbfc}
footer{text-align:center;color:var(--mut);font-size:11px;padding:8px 0 20px}
.hide{display:none!important}
details summary{cursor:pointer;font-weight:600;color:var(--navy2)}

const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const COMM_IDX = {}; COMMUNES.forEach(c=>COMM_IDX[norm(c[0])]=c);
function findCommune(txt){
  const n=' '+norm(txt)+' ';
  if(!n.trim()) return null;
  if(COMM_IDX[n.trim()]) return COMM_IDX[n.trim()];
  let best=null; // nom le plus long contenu dans le texte (évite "Lens" dans "Valenciennes")
  for(const c of COMMUNES){const k=' '+norm(c[0])+' '; if(n.includes(k) && (!best||k.length>norm(best[0]).length+2)) best=c;}
  if(!best && /\bbruay\b/.test(n)) best=COMM_IDX['bruay la buissiere'];
  return best;
}

function hav(a,b){ const R=6371, r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const P = ()=>S.params;
function road(a,b){ return hav(a,b)*P().facteurRoute; }
function minutes(km){ return km/P().vitesse*60; }
function coordsOf(ch){
  if(ch.lat!=null && ch.lon!=null && ch.lat!=='' && ch.lon!=='') return {lat:+ch.lat,lon:+ch.lon};
  const c=findCommune(ch.commune); return c?{lat:c[1],lon:c[2]}:null;
}

/* ---------- Lecteur XLSX / CSV sans dépendance ---------- */
async function inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw'); const w=ds.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf); let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('Fichier Excel illisible (zip)');
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const files={}; const td=new TextDecoder();
  for(let i=0;i<n;i++){
    const meth=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(off+26,true), lel=dv.getUint16(off+28,true); const start=off+30+lnl+lel;
    const data=u8.subarray(start,start+csize);
    files[name]={meth,data}; p+=46+nl+el+cl;
  }
  return { async text(name){ const f=files[name]; if(!f) return null; const raw=f.meth===8?await inflateRaw(f.data):f.data; return new TextDecoder().decode(raw);} , names:Object.keys(files)};
}
function colIdx(ref){ const m=/^([A-Z]+)/.exec(ref); let n=0; for(const ch of m[1]) n=n*26+ch.charCodeAt(0)-64; return n-1; }
async function readXlsx(buf){
  const z=await unzip(buf); const dp=new DOMParser();
  const ssX=await z.text('xl/sharedStrings.xml'); const ss=[];
  if(ssX){ const d=dp.parseFromString(ssX,'application/xml'); for(const si of d.getElementsByTagName('si')){ let t=''; for(const x of si.getElementsByTagName('t')) t+=x.textContent; ss.push(t);} }
  const wb=dp.parseFromString(await z.text('xl/workbook.xml'),'application/xml');
  const rels=dp.parseFromString(await z.text('xl/_rels/workbook.xml.rels'),'application/xml'); const rmap={};
  for(const r of rels.getElementsByTagName('Relationship')) rmap[r.getAttribute('Id')]=r.getAttribute('Target');

  const dateStyles=new Set(); const stX=await z.text('xl/styles.xml');
  if(stX){ const sd=dp.parseFromString(stX,'application/xml'); const custom={};
    for(const nf of sd.getElementsByTagName('numFmt')) custom[nf.getAttribute('numFmtId')]=nf.getAttribute('formatCode')||'';
    const xfs=sd.getElementsByTagName('cellXfs')[0]; if(xfs){ [...xfs.getElementsByTagName('xf')].forEach((xf,i)=>{ const id=+xf.getAttribute('numFmtId');
      if((id>=14&&id<=22)||(id>=45&&id<=47)||(custom[id]&&/[dy]/i.test(custom[id].replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'')))) dateStyles.add(i); }); } }
  const sheets=[];
  for(const sh of wb.getElementsByTagName('sheet')){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=rmap[rid]||''; tgt=tgt.replace(/^\/?xl\//,''); const x=await z.text('xl/'+tgt); if(!x) continue;
    const d=dp.parseFromString(x,'application/xml'); const rows=[];
    for(const r of d.getElementsByTagName('row')){ const ri=+r.getAttribute('r')-1; const row=[];
      for(const c of r.getElementsByTagName('c')){ const t=c.getAttribute('t'), s=+c.getAttribute('s'), v=c.getElementsByTagName('v')[0], is=c.getElementsByTagName('is')[0];
        let val=null; if(t==='s'&&v) val=ss[+v.textContent]; else if(t==='inlineStr'&&is) val=is.textContent; else if(t==='b'&&v) val=v.textContent==='1'; else if(v){ val=v.textContent; if(t!=='str'&&t!=='e'){ const n=+val; if(!isNaN(n)){ val = dateStyles.has(s)&&n>20000&&n<80000 ? excelDate(n) : n; } } }
        row[colIdx(c.getAttribute('r'))]=val; }

function excelDate(n){ const d=new Date(Date.UTC(1899,11,30)+Math.round(n*86400000)); return d.toISOString().slice(0,10); }
function readCsv(text){
  const first=text.split(/\r?\n/)[0]||''; const sep=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){row.push(cell);cell='';} else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';} else cell+=ch; }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return [{name:'CSV',rows}];
}
function parseDateAny(v){
  if(v==null||v==='') return '';

  const s=String(v).trim(); let m;
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s))){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}

/* ---------- Correspondance des colonnes ---------- */
const FIELDS = [
  {k:'ug',lib:'N° logement / UG',kw:['ug','n ug','numero ug','logement','n logement','code logement','reference','ref logement','id logement']},
  {k:'adresse',lib:'Adresse',kw:['adresse','rue','voie']},
  {k:'commune',lib:'Commune / ville',kw:['commune','ville','localite','cite']},
  {k:'prog',lib:'Programme (Évolud 1 / 2)',kw:['programme','chantier','operation','lot commande','evolud']},
  {k:'scenario',lib:'Scénario',kw:['scenario','scenar','scn']},
  {k:'debut',lib:'Date de démarrage travaux',kw:['date debut','debut travaux','demarrage','date demarrage','date intervention','date travaux','debut','date prevue','date de debut']},
  {k:'vte',lib:'Date VTE',kw:['date vte','vte','visite technique']},
  {k:'diag',lib:'Diag amiante (statut)',kw:['diag','amiante','diagnostic']}
];
function detectMapping(headers){
  const H=headers.map(h=>norm(h)); const map={fields:{},presta:{}}; const used=new Set();
  for(const f of FIELDS){ let best=-1,bs=0;
    H.forEach((h,i)=>{ if(used.has(i)||!h) return; for(const k of f.kw){ const sc = h===k?3 : (h.startsWith(k+' ')||h.endsWith(' '+k))?2 : (h.includes(k)&&k.length>3)?1:0; if(sc>bs){bs=sc;best=i;} } });
    if(best>=0){ map.fields[f.k]=best; used.add(best); } }
  for(const p of S.catalogue){ let best=-1,bs=0;
    H.forEach((h,i)=>{ if(used.has(i)||!h) return; for(const k of p.kw){ const sc = h===k?3 : (h.includes(k)&&k.length>2)?(k.length>6?2:1):0; if(sc>bs){bs=sc;best=i;} } });
    if(best>=0){ map.presta[p.code]=best; used.add(best); } }
  return map;
}
function findHeaderRow(rows){
  let best=0,bs=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){ const r=rows[i]||[]; const m=detectMapping(r.map(x=>x==null?'':String(x)));
    const sc=Object.keys(m.fields).length*2+Object.keys(m.presta).length; if(sc>bs){bs=sc;best=i;} }
  return best;
}
function prestaValue(v){
  const n=norm(v);
  if(!n) return '';
  if(n==='dp'||n.includes('double plafond')||n.includes('attente diag')) return 'DP';
  if(n==='oui'||n==='fait'||n==='ok'||n==='x fait') return 'fait';
  if(n.includes('rdv')) return 'afaire';
  if(n==='non'||n==='a faire'||n==='x'||n==='1'||/^\d+([.,]\d+)?$/.test(n)&&+n.replace(',','.')>0) return 'afaire';
  if(n==='0'||n==='sans objet'||n==='so'||n==='na'||n==='n a'||n==='-') return '';
  return 'afaire';
}
let IMPORT_TMP=null;
async function handleFile(file){
  try{
    const buf=await file.arrayBuffer();
    const sheets=/\.csv$/i.test(file.name)? readCsv(new TextDecoder('utf-8').decode(buf)) : await readXlsx(buf);
    // feuille la plus riche en colonnes reconnues
    let best=null,bs=-1;
    for(const sh of sheets){ if(!sh.rows.length) continue; const hr=findHeaderRow(sh.rows); const m=detectMapping((sh.rows[hr]||[]).map(x=>x==null?'':String(x)));
      const sc=(m.fields.ug!=null?10:0)+Object.keys(m.fields).length*2+Object.keys(m.presta).length; if(sc>bs){bs=sc;best={sh,hr,m};} }
    if(!best) throw new Error('Aucune feuille exploitable');
    // Extraction BDD Gamma : feuille logements (ID_UG + Code UG) + feuille commandes (ID_UG / Article / Quantité)
    const nM=importMextList(sheets,file.name);
    if(importGammaExtraction(sheets,file.name,nM)) return;
    if(nM){ save(); recompute(); toast(nM+' logements du suivi MEXT : commandes et réceptions mises à jour'); show('kits'); return; }
    // Bons de commande Gamma (format ligne à ligne : UG / Article / Quantité) → import direct, sans écran de correspondance
    for(const sh of sheets){ for(let hr=0;hr<Math.min(sh.rows.length,10);hr++){ const H=Array.from(sh.rows[hr]||[],norm);
      if(H.includes('ug') && H.some(h=>h.startsWith('article')) && H.some(h=>h.startsWith('quantite'))){
        const {out,unk}=importBdc(sh,hr); const n=Object.keys(out).length; if(!n) continue;
        Object.assign(S.bdc,out); S.bdcSource={fichier:file.name,date:new Date().toLocaleString('fr-FR'),nb:Object.keys(S.bdc).length,nonReconnus:unk};
        save(); recompute(); toast(n+' bons de commande intégrés ('+Object.keys(unk).length+' article(s) non reconnu(s))'); show('kits'); return; } } }
    IMPORT_TMP={file:file.name,sheets,cur:best};
    renderDonnees();
    toast('Fichier lu : vérifiez les colonnes puis validez');
  }catch(e){ console.error(e); alert('Import impossible : '+e.message); }
}
function selectImportSheet(name){
  const sh=IMPORT_TMP.sheets.find(s=>s.name===name); const hr=findHeaderRow(sh.rows);
  IMPORT_TMP.cur={sh,hr,m:detectMapping((sh.rows[hr]||[]).map(x=>x==null?'':String(x)))}; renderDonnees();
}
function applyImport(){
  const {sh,hr,m}=IMPORT_TMP.cur;
  // relire les choix de l'utilisateur
  document.querySelectorAll('[data-mapf]').forEach(s=>{ const v=s.value; if(v==='') delete m.fields[s.dataset.mapf]; else m.fields[s.dataset.mapf]=+v; });
  document.querySelectorAll('[data-mapp]').forEach(s=>{ const v=s.value; if(v==='') delete m.presta[s.dataset.mapp]; else m.presta[s.dataset.mapp]=+v; });
  if(m.fields.ug==null){ alert('Indiquez la colonne du n° de logement / UG.'); return; }
  const out=[]; const seen=new Set();
  for(let i=hr+1;i<sh.rows.length;i++){ const r=sh.rows[i]||[]; const ug=String(r[m.fields.ug]??'').trim(); if(!ug||seen.has(ug)) continue; seen.add(ug);
    const g=k=> m.fields[k]!=null? r[m.fields[k]] : '';
    const adr=String(g('adresse')??'').trim(); let com=String(g('commune')??'').trim();
    const fc=findCommune(com)||findCommune(adr); if(fc) com=fc[0];
    const pr={}; for(const code in m.presta){ const v=prestaValue(r[m.presta[code]]); if(v) pr[code]=v; }
    const progTxt=norm(g('prog')); const prog = /2/.test(progTxt)?'Évolud 2': /1/.test(progTxt)?'Évolud 1':'';
    out.push({ug,adresse:adr,commune:com,prog,scenario:String(g('scenario')??'').trim(),debut:parseDateAny(g('debut')),vte:parseDateAny(g('vte')),diag:String(g('diag')??'').trim(),pr});
  }

  S.source={fichier:IMPORT_TMP.file,feuille:sh.name,date:new Date().toLocaleString('fr-FR'),nb:out.length};
  // rattacher les logements aux chantiers (créés si commune inconnue)

}
function chantierFor(l){
  const prog=l.prog||'';
  let ch=S.chantiers.find(c=>norm(c.commune)===norm(l.commune) && (!prog||c.prog===prog));
  if(!ch && l.commune){ ch={id:'CH-'+norm(l.commune).replace(/ /g,'-').toUpperCase()+(prog?'-'+norm(prog).replace(/ /g,''):''),nom:(prog?prog+' – ':'')+l.commune,commune:l.commune,prog:prog||'—',statut:'actif',nb:null,debut:'',fin:'',baseVie:false}; S.chantiers.push(ch); }
  return ch?ch.id:null;
}

/* ---------- MOTEUR LOGISTIQUE ---------- */
let R = {}; // résultats calculés
let LOGS = []; // vue fusionnée : planning + extraction Gamma + bons de commande (rien n'est recopié)
function buildLogs(){
  const m=new Map();
  S.logements.filter(l=>!l.horsPlanning).forEach(l=>m.set(l.ug,Object.assign({},l,{pr:l.pr||{}})));
  for(const ug in (S.gamma||{})){ const g=S.gamma[ug]; let l=m.get(ug);
    if(!l){ l={ug,adresse:'',commune:'',prog:'',scenario:'',debut:'',vte:'',diag:'',pr:{},ch:null,srcGamma:true}; m.set(ug,l); }
    if(!l.adresse) l.adresse=g.adresse; if(!l.commune) l.commune=g.commune; if(!l.vte) l.vte=g.vte;
    if(g.debut){ l.debutPlanning=l.debut; l.debut=g.debut; l.debutGamma=true; } l.fin=g.fin; l.vts=g.vts; }
  for(const ug in (S.bdc||{})) if(!m.has(ug)) m.set(ug,{ug,adresse:'',commune:'',prog:'',scenario:'',debut:'',vte:'',diag:'',pr:{},ch:null,horsPlanning:true});
  const out=[...m.values()]; out.forEach(l=>{ if(!l.ch||!S.chantiers.some(c=>c.id===l.ch)) l.ch=chantierFor(l); }); return out;
}
function catByCode(c){ return S.catalogue.find(x=>x.code===c); }
function kitOf(l){
  if(S.bdc[l.ug]) return bdcKit(S.bdc[l.ug]);
  // besoins du logement = prestations "à faire" en mode kit / sur-mesure / plateforme
  const lines=[]; const cot=[]; let vol=0,kg=0;
  for(const code in l.pr){ if(l.pr[code]!=='afaire') continue; const c=catByCode(code); if(!c) continue;
    if(c.mode==='cotraitant'){ cot.push(c); continue; }
    for(const a of c.art){ lines.push({code,mode:c.mode,lot:c.lot,ent:c.ent,id:a.id,des:a.des,q:a.q,u:a.u,v:a.v*a.q,kg:a.kg*a.q,delai:c.delai}); vol+=a.v*a.q; kg+=a.kg*a.q; } }
  return {lines,cot,vol,kg,unknown:[],codes:Object.keys(l.pr).filter(c=>l.pr[c]==='afaire'),src:'prestations'};
}
function recompute(){
  const p=P(), today=todayISO(), horizonEnd=addDays(today,p.horizon*7);
  LOGS=buildLogs();
  const base={lat:p.base.lat,lon:p.base.lon};
  // 1. chantiers : coordonnées, distances, volumes
  const chs=S.chantiers.map(c=>{ const co=coordsOf(c); const logs=LOGS.filter(l=>l.ch===c.id);
    const nb = logs.length || (+c.nb||0);
    const km = co? road(base,co):null;
    return Object.assign({},c,{co,logs,nbEff:nb,km,min:km!=null?minutes(km):null}); });
  // 2. kits par logement + allocation stock (ordre chronologique)
  const stockLeft=Object.assign({},S.stock); const kits=[];
  const logsSorted=[...LOGS].sort((a,b)=>(a.debut||'9999').localeCompare(b.debut||'9999'));
  for(const l of logsSorted){
    const k=kitOf(l); const miss=[]; const sm=[]; let wait=[];
    if(Object.values(l.pr).includes('DP')) wait.push('Double plafond : attente diag complémentaire');
    if(!l.debut) wait.push('Pas de date de démarrage planifiée');
    if(/sans|non|absent|manquant|attente/i.test(l.diag||'')) wait.push('Diag amiante : '+l.diag);
    const agg={}; for(const ln of k.lines){ if(ln.mode!=='kit') continue; agg[ln.id]=(agg[ln.id]||0)+ln.q; }
    // sur-mesure / plateforme : commande + délai
    const codesSM=[...new Set(k.lines.filter(x=>x.mode!=='kit').map(x=>x.code))];
    for(const code of codesSM){ const c=catByCode(code); if(!c) continue; const cmd=(S.commandes[l.ug]||{})[code];
      const arr= S.receptions[l.ug] || (cmd? addDays(cmd,c.delai): null); const limite = l.debut? addDays(l.debut,-c.delai): null;
      sm.push({code,lib:c.lib,mode:c.mode,cmd,arr,limite,ok: !!(arr && l.debut && arr<=l.debut), late: !cmd && limite && limite<today, risk: arr && l.debut && arr>l.debut}); }
    let status;
    const prepared=S.prepares[l.ug], delivered=S.livres[l.ug];
    if(!wait.length && l.debut){ for(const id in agg){ const have=stockLeft[id]||0; if(have>=agg[id]) stockLeft[id]=have-agg[id]; else { miss.push({id,need:agg[id],have:Math.max(0,have)}); stockLeft[id]=0; } } }
    const doneAll = !!l.vts || (l.fin && l.fin<today) || (!S.bdc[l.ug] && Object.keys(l.pr).length>0 && Object.values(l.pr).every(v=>v==='fait'));
    if(doneAll) status='termine';
    else if(l.debutGamma && l.debut<today) status='encours';
    else if(delivered) status='livre';
    else if(wait.length) status='attente';
    else if(miss.length || sm.some(x=>x.late||x.risk||(!x.cmd&&x.limite&&x.limite<=todayISO()))) status='incomplet';
    else if(prepared) status='pret';
    else status='apreparer';
    kits.push({l,k,miss,sm,wait,status,inHorizon: l.debut && l.debut>=today && l.debut<=horizonEnd});
  }
  // 3. besoins / ruptures / surplus par article (horizon + total)
  const art={}; S.catalogue.forEach(c=>c.art.forEach(a=>{ if(c.mode==='kit') art[a.id]=art[a.id]||{id:a.id,des:a.des,u:a.u,v:a.v,delai:c.delai,besH:0,besT:0,first:null}; }));
  for(const id in ART_BDC){ const a=ART_BDC[id]; if(a.mode==='kit') art[id]=Object.assign(art[id]||{id,besH:0,besT:0,first:null},{des:a.des,u:a.u,v:a.v,delai:a.delai}); }
  for(const kt of kits){ if(kt.status==='termine'||kt.status==='livre'||kt.status==='encours') continue; for(const ln of kt.k.lines){ if(ln.mode!=='kit') continue; const a=art[ln.id]; if(!a) continue;
    a.besT+=ln.q; if(kt.inHorizon){ a.besH+=ln.q; if(!a.first||kt.l.debut<a.first) a.first=kt.l.debut; } } }
  const artList=Object.values(art).map(a=>{ const st=+S.stock[a.id]||0; const manqueH=Math.max(0,a.besH-st); const surplus=Math.max(0,st-a.besT);
    const cmdAvant = a.first? prevWorkDay(a.first, Math.max(1,Math.ceil(a.delai*5/7))+1): null;
    const semaines=p.horizon; return Object.assign(a,{st,manqueH,surplus,parSem:a.besH/semaines,cmdAvant,volSem:a.besH/semaines*a.v}); });
  // 4. secteurs géographiques (regroupement des chantiers proches)
  const pts=chs.filter(c=>c.co && c.nbEff>0);
  const clusters=[]; for(const c of pts){ let cl=clusters.find(k=>k.items.some(x=>hav(x.co,c.co)*p.facteurRoute<=p.rayonCluster)); if(cl) cl.items.push(c); else clusters.push({items:[c]}); }
  // fusion transitive
  let merged=true; while(merged){ merged=false; outer: for(let i=0;i<clusters.length;i++) for(let j=i+1;j<clusters.length;j++){ if(clusters[i].items.some(a=>clusters[j].items.some(b=>hav(a.co,b.co)*p.facteurRoute<=p.rayonCluster))){ clusters[i].items.push(...clusters[j].items); clusters.splice(j,1); merged=true; break outer; } } }
  clusters.forEach(cl=>{ cl.key=cl.items.map(x=>norm(x.commune)).sort().filter((v,i,a)=>a.indexOf(v)===i).join('+');
    cl.nom=[...new Set(cl.items.map(x=>x.commune))].join(' / ');
    const w=cl.items.reduce((s,x)=>s+x.nbEff,0); cl.nb=w;
    cl.bary={lat:cl.items.reduce((s,x)=>s+x.co.lat*x.nbEff,0)/w, lon:cl.items.reduce((s,x)=>s+x.co.lon*x.nbEff,0)/w};
    cl.km=road(base,cl.bary); cl.min=minutes(cl.km); });

  const tampActifs=new Set(Object.keys(S.tampons).filter(k=>S.tampons[k].actif));
  const clOf=chId=>clusters.find(cl=>cl.items.some(x=>x.id===chId));
  const byDay={}; const plateforme=[]; const cotra=[];
  for(const kt of kits){ if(!kt.inHorizon||kt.status==='attente'||kt.status==='termine'||kt.status==='livre') continue;
    const dl=prevWorkDay(kt.l.debut,p.jPrep); const ch=chs.find(c=>c.id===kt.l.ch);
    const volKit=kt.k.lines.filter(x=>x.mode!=='plateforme').reduce((s,x)=>s+x.v,0);
    if(kt.k.lines.some(x=>x.mode==='plateforme')) plateforme.push({date:kt.l.debut,ug:kt.l.ug,adresse:kt.l.adresse,commune:kt.l.commune});
    kt.k.cot.forEach(c=>cotra.push({date:kt.l.debut,ug:kt.l.ug,commune:kt.l.commune,ent:c.ent,lib:c.lib+(c.q?' – '+fmt(c.q,1)+' '+c.u:'')}));
    if(volKit<=0) continue;
    (byDay[dl]=byDay[dl]||[]).push({kt,ch,vol:volKit,cl:ch?clOf(ch.id):null,dl}); }
  const tournees=[];
  for(const d of Object.keys(byDay).sort()){
    const items=byDay[d]; const direct=items.filter(x=>!(x.cl&&tampActifs.has(x.cl.key)));
    const viaT=items.filter(x=>x.cl&&tampActifs.has(x.cl.key));
    if(direct.length){ const stops=groupStops(direct); const vol=direct.reduce((s,x)=>s+x.vol,0); const trips=Math.max(1,Math.ceil(vol/p.capVL));
      const route=bestRoute(base,stops); const km=route.km*trips; const h=(minutes(route.km)*trips + p.tChargeBase*trips + p.tArret*direct.length)/60;
      tournees.push({date:d,type:'direct',items:direct,stops:route.order,vol,trips,km,h,cout:km*p.coutKmVL+h*p.coutHeure}); }
    if(viaT.length){ const byCl={}; viaT.forEach(x=>(byCl[x.cl.key]=byCl[x.cl.key]||[]).push(x));
      for(const k in byCl){ const t=S.tampons[k]; const its=byCl[k]; const vol=its.reduce((s,x)=>s+x.vol,0);
        const tp={lat:t.lat,lon:t.lon}; const route=bestRoute(tp,groupStops(its)); const h=(minutes(route.km)+p.tArret*its.length+p.manutKit*its.length)/60;
        tournees.push({date:d,type:'tampon',tampon:t.lieu,key:k,items:its,stops:route.order,vol,trips:Math.max(1,Math.ceil(vol/p.capVL)),km:route.km,h,cout:route.km*p.coutKmVL+h*p.coutHeure}); } }
  }
  // navettes hebdomadaires vers tampons actifs
  const navettes=[];
  for(const k of tampActifs){ const t=S.tampons[k]; const its=tournees.filter(x=>x.key===k); if(!its.length) continue;
    const weeks={}; its.forEach(x=>{ const wk=weekKey(x.date); (weeks[wk]=weeks[wk]||{vol:0,first:x.date}); weeks[wk].vol+=x.vol; if(x.date<weeks[wk].first) weeks[wk].first=x.date; });
    for(const wk in weeks){ const km=2*road(base,{lat:t.lat,lon:t.lon}); const trips=Math.max(1,Math.ceil(weeks[wk].vol/p.capPL)); const h=(minutes(km)+p.tChargeBase+20)*trips/60;
      navettes.push({date:prevWorkDay(weeks[wk].first,1),tampon:t.lieu,key:k,vol:weeks[wk].vol,trips,km:km*trips,h,cout:km*trips*p.coutKmPL+h*p.coutHeure}); } }
  // 6. analyse zones tampons (économique + géographique + opérationnelle)
  const analyses=clusters.map(cl=>analyseTampon(cl,kits,base));
  // 7. alertes
  const alertes=buildAlertes(chs,kits,artList,tournees,analyses);
  R={chs,kits,artList,clusters,tournees,navettes,plateforme,cotra,analyses,alertes,base,today,horizonEnd};
  const nb=alertes.filter(a=>a.niv==='ko').length; $('#nbAl').innerHTML= nb?`<span class="bdg">${nb}</span>`:'';
  renderCurrent();
}
function weekKey(isoS){ const d=toD(isoS); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return iso(d); }
function groupStops(items){ const m={}; for(const x of items){ const co=x.ch&&x.ch.co; const key=x.ch?x.ch.id:'?'; if(!co) continue; (m[key]=m[key]||{id:key,nom:x.ch.commune,co,n:0,vol:0}); m[key].n++; m[key].vol+=x.vol; } return Object.values(m); }
function bestRoute(start,stops){
  if(!stops.length) return {order:[],km:0};
  const dist=(a,b)=>road(a,b);
  const tour=o=>{ let km=0,cur=start; for(const s of o){ km+=dist(cur,s.co); cur=s.co; } return km+dist(cur,start); };
  if(stops.length<=7){ let best=null,bk=1e9; const perm=(arr,l=0)=>{ if(l===arr.length){ const k=tour(arr); if(k<bk){bk=k;best=[...arr];} return; } for(let i=l;i<arr.length;i++){ [arr[l],arr[i]]=[arr[i],arr[l]]; perm(arr,l+1); [arr[l],arr[i]]=[arr[i],arr[l]]; } }; perm([...stops]); return {order:best,km:bk}; }
  // plus proche voisin + 2-opt
  let rest=[...stops], o=[], cur=start; while(rest.length){ rest.sort((a,b)=>dist(cur,a.co)-dist(cur,b.co)); const n=rest.shift(); o.push(n); cur=n.co; }
  let imp=true; while(imp){ imp=false; for(let i=0;i<o.length-1;i++) for(let j=i+1;j<o.length;j++){ const n=[...o.slice(0,i),...o.slice(i,j+1).reverse(),...o.slice(j+1)]; if(tour(n)<tour(o)-0.01){o=n;imp=true;} } }
  return {order:o,km:tour(o)};
}
function analyseTampon(cl,kits,base){
  const p=P(); const ids=new Set(cl.items.map(x=>x.id));
  // volumes et logements de ce secteur : logements importés à dates connues, sinon effectif × hypothèse
  const ks=kits.filter(k=>ids.has(k.l.ch) && k.status!=='termine');
  let nbLog, vol, jours, src;
  if(ks.length){
    nbLog=ks.length; vol=ks.reduce((s,k)=>s+k.k.lines.filter(x=>x.mode!=='plateforme').reduce((a,b)=>a+b.v,0),0);
    const dates=new Set(ks.filter(k=>k.l.debut).map(k=>k.l.debut)); jours=Math.max(dates.size, Math.ceil(nbLog/(p.cadenceDefaut*cl.items.length)));
    src='logements importés ('+nbLog+')';
  } else { nbLog=cl.nb; vol=nbLog*p.volDefaut; jours=Math.ceil(nbLog/(p.cadenceDefaut*Math.max(1,cl.items.length))); src='effectif déclaré × '+fmt(p.volDefaut,1)+' m³/logt (hypothèse)'; }
  const semaines=Math.max(1,Math.ceil(jours/5)); const mois=Math.max(1,semaines/4.33);
  const stopsPerDay=Math.min(cl.items.length, cl.items.length); // un arrêt par chantier livré dans la journée
  const intra = cl.items.length>1 ? bestRoute(cl.bary,cl.items.map(x=>({co:x.co}))).km : 0;
  const kmRT = 2*cl.km + intra;
  const kitsParJour = nbLog/Math.max(1,jours);
  // DIRECT : une tournée VL par jour de démarrage depuis Bruay
  const tripsDay=Math.max(1,Math.ceil(vol/jours/p.capVL));
  const dKm=kmRT*tripsDay*jours; const dH=((minutes(kmRT)+p.tChargeBase)*tripsDay + p.tArret*kitsParJour)*jours/60;
  const direct={km:dKm,h:dH,cout:dKm*p.coutKmVL+dH*p.coutHeure};
  // RELAIS : navette porteur hebdo + derniers km depuis le tampon + manutention + stockage
  const hasBV=cl.items.some(x=>x.baseVie);
  const tLieu = hasBV? cl.items.filter(x=>x.baseVie).sort((a,b)=>b.nbEff-a.nbEff)[0] : [...cl.items].sort((a,b)=>b.nbEff-a.nbEff)[0];
  const tco=tLieu.co; const kmBT=2*road(base,tco);
  const navTrips=Math.max(semaines, Math.ceil(vol/p.capPL));
  const nKm=kmBT*navTrips; const nH=(minutes(kmBT)+p.tChargeBase+20)*navTrips/60;
  const lastKm=(cl.items.length>1? bestRoute(tco,cl.items.map(x=>({co:x.co}))).km : 2)*jours;
  const lastH=(minutes(lastKm/jours)*jours + p.tArret*nbLog)/60;
  const manH=p.manutKit*nbLog/60;
  const stock= hasBV? 0 : p.coutStockMois*Math.ceil(mois);
  const relais={km:nKm+lastKm,h:nH+lastH+manH,stock,cout:nKm*p.coutKmPL+lastKm*p.coutKmVL+(nH+lastH+manH)*p.coutHeure+stock};
  const gain=direct.cout-relais.cout; const gainPct= direct.cout>0? gain/direct.cout*100 : 0;
  const crit={geo: cl.km>=p.seuilKm, eco: gainPct>=p.seuilGain, ops: kitsParJour>=1 && semaines>=2};
  const reco = crit.geo && crit.eco && crit.ops;
  const enBase = cl.km<3;
  return {cl,nbLog,vol,jours,semaines,mois,src,direct,relais,gain,gainPct,crit,reco,enBase,lieu:tLieu,hasBV,kitsParJour,tripsDay};
}
function buildAlertes(chs,kits,artList,tournees,analyses){
  const A=[]; const p=P(); const t=todayISO();
  if(!LOGS.length) A.push({niv:'info',t:'Aucun logement importé',d:"Importez l'export logements d'EVOLUD ou Planning_EVOLUD (onglet Données) pour générer les kits par logement."});
  chs.forEach(c=>{ if(!c.co) A.push({niv:'ko',t:'Chantier non localisé : '+c.nom,d:'Commune « '+(c.commune||'?')+" » inconnue : saisissez latitude / longitude dans Données."});
    if(!c.logs.length && !c.nb) A.push({niv:'info',t:'Effectif à renseigner : '+c.nom,d:'Nombre de logements inconnu : le chantier est exclu des calculs de transport.'}); });
  artList.filter(a=>a.manqueH>0).forEach(a=>A.push({niv: a.cmdAvant&&a.cmdAvant<=t?'ko':'warn',g:a.cmdAvant&&a.cmdAvant<=t?'Ruptures à commander immédiatement':'Ruptures à anticiper',ug:a.des,d:`manque ${fmt(a.manqueH)} ${a.u} (besoin ${fmt(a.besH)}, stock ${fmt(a.st)}), commander avant ${frDate(a.cmdAvant)}`}));
  kits.filter(k=>k.status!=='termine'&&k.status!=='encours').forEach(k=>{ k.sm.forEach(s=>{ if(s.late) A.push({niv:'ko',g:`Commande ${s.code} en retard`,ug:k.l.ug,d:`démarrage ${frDate(k.l.debut)}, limite ${frDate(s.limite)}`});
      else if(s.risk) A.push({niv:'ko',g:`Livraison ${s.code} après démarrage`,ug:k.l.ug,d:`arrivée ${frDate(s.arr)} > démarrage ${frDate(k.l.debut)}`}); });
    if(k.inHorizon && k.status==='incomplet' && diffDays(k.l.debut,t)<=3) A.push({niv:'ko',g:'Kit incomplet à moins de 3 jours du démarrage',ug:k.l.ug,d:'J-'+diffDays(k.l.debut,t)+' '+(k.miss.length?'Manquants : '+k.miss.map(m=>m.id+' ('+fmt(m.need-m.have)+')').join(', '):'sur-mesure non arrivé ou non commandé')});
    if(k.inHorizon && k.status==='attente' && k.l.debut) A.push({niv:'warn',g:'Démarrage planifié mais kit bloqué',ug:k.l.ug,d:k.wait.join(' · ')+' (démarrage '+frDate(k.l.debut)+')'}); });
  tournees.forEach(x=>{ if(x.trips>1) A.push({niv:'warn',g:'Capacité utilitaire dépassée',ug:frDate(x.date),d:`${fmt(x.vol,1)} m³ → ${x.trips} rotations (avancer des kits la veille ou faire livrer l'isolant en direct par le fournisseur)`}); });
  analyses.filter(a=>a.reco && !(S.tampons[a.cl.key]||{}).actif).forEach(a=>A.push({niv:'info',t:'Zone tampon recommandée : '+a.cl.nom,d:`Gain estimé ${eur(a.gain)} (${fmt(a.gainPct)} %) sur la période. Voir l'onglet Tampons.`}));
  const G=[], idx={};
  for(const a of A){ if(!a.g){ G.push(a); continue; } const k=a.niv+'|'+a.g; if(!idx[k]){ idx[k]={niv:a.niv,g:a.g,ugs:[],ds:[]}; G.push(idx[k]); } idx[k].ugs.push(a.ug); idx[k].ds.push(a.ug+' : '+a.d); }
  G.forEach(x=>{ if(x.ugs){ x.t=x.g+' ('+x.ugs.length+')'; x.d=x.ds.slice(0,12).join(' · ')+(x.ds.length>12?' · … +'+(x.ds.length-12):''); } });
  const ord={ko:0,warn:1,info:2}; return G.sort((a,b)=>ord[a.niv]-ord[b.niv]);
}

function proj(){
  const pts=[R.base,...R.chs.filter(c=>c.co).map(c=>c.co),...Object.values(S.tampons).filter(t=>t.actif)];
  const lat0=pts.reduce((s,p)=>s+p.lat,0)/pts.length; const cx=Math.cos(lat0*Math.PI/180);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9; pts.forEach(p=>{const x=p.lon*cx,y=-p.lat; minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const W=MW,H=MH; const k=Math.min((W-Math.min(240,W*.42))/Math.max(maxX-minX,0.02),(H-110)/Math.max(maxY-minY,0.02)); const ox=W/2-(minX+maxX)/2*k, oy=H/2-(minY+maxY)/2*k;
  return p=>{ const x=(p.lon*cx*k+ox-W/2)*MAPV.k+W/2+MAPV.x, y=(-p.lat*k+oy-H/2)*MAPV.k+H/2+MAPV.y; return [x,y]; };
}

function infoChantier(id){ const c=R.chs.find(x=>x.id===id); const ks=R.kits.filter(k=>k.l.ch===id); const cnt=s=>ks.filter(k=>k.status===s).length;

function panZoom(svg){
  let drag=null; const pts=new Map(); let pinch=null;
  const sc=()=>1;
  svg.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,[e.clientX,e.clientY]); if(pts.size===1) drag={x:e.clientX,y:e.clientY,vx:MAPV.x,vy:MAPV.y}; if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:MAPV.k}; drag=null; } });
  svg.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pinch&&pts.size===2){ const [a,b]=[...pts.values()]; MAPV.k=Math.max(.4,Math.min(12,pinch.k*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d)); drawMap(); }
    else if(drag){ const dx=(e.clientX-drag.x)*sc(), dy=(e.clientY-drag.y)*sc(); if(Math.abs(dx)+Math.abs(dy)>4){ MAPV.x=drag.vx+dx; MAPV.y=drag.vy+dy; drawMap(); } } });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(!pts.size) drag=null; };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up); svg.addEventListener('pointerleave',up);
  svg.addEventListener('wheel',e=>{ e.preventDefault(); MAPV.k=Math.max(.4,Math.min(12,MAPV.k*(e.deltaY<0?1.15:1/1.15))); drawMap(); },{passive:false});
}

function justif(an){
  if(!an) return ''; const p=P(); const act=(S.tampons[an.cl.key]||{}).actif;
  const ok=v=>v?'<span class="pill p-ok">✓</span>':'<span class="pill p-ko">✗</span>';
  const verdict = an.enBase? 'Secteur de la base : livraison directe depuis Bruay, aucune zone tampon utile.'
    : an.reco? `ZONE TAMPON RECOMMANDÉE à ${esc(an.lieu.commune)}${an.hasBV?' (base-vie existante)':' (conteneur à installer)'}`
    : 'Pas de zone tampon : la livraison directe depuis Bruay reste la meilleure option.';
  return `<div class="verdict" style="color:${an.reco?'var(--acc)':'var(--ok)'}">${verdict}</div>
   <p class="small mut">Secteur ${esc(an.cl.nom)} · base de calcul : ${esc(an.src)} · ${an.jours} jours de livraison sur ~${an.semaines} semaines · ${fmt(an.kitsParJour,1)} kit/jour · ${fmt(an.vol,1)} m³</p>
   <p>${ok(an.crit.geo)} <b>Géographique</b> : ${fmt(an.cl.km,1)} km / ${fmt(an.cl.min)} min de Bruay (seuil ${p.seuilKm} km).</p>
   <p>${ok(an.crit.eco)} <b>Économique</b> : direct ${eur(an.direct.cout)} (${fmt(an.direct.km)} km, ${fmt(an.direct.h)} h) contre plateforme relais ${eur(an.relais.cout)} (navettes + derniers km ${fmt(an.relais.km)} km, ${fmt(an.relais.h)} h dont manutention, stockage ${eur(an.relais.stock)}). Écart ${an.gain>=0?'gain':'surcoût'} ${eur(Math.abs(an.gain))} soit ${fmt(an.gainPct)} % (seuil ${p.seuilGain} %).</p>
   <p>${ok(an.crit.ops)} <b>Opérationnel</b> : ${fmt(an.kitsParJour,1)} kit(s)/jour pendant ~${an.semaines} semaine(s) ${an.crit.ops?'→ flux régulier qui justifie un stock avancé (moins de rupture, équipes servies dès 7 h).':'→ flux trop faible ou trop court pour immobiliser un stock.'}</p>
   ${!an.enBase&&an.reco?`<div class="row noprint" style="margin-top:6px"><button class="btn ${act?'sec':'acc'} sm" data-act="${esc(an.cl.key)}">${act?'Désactiver la zone tampon':'Activer cette zone tampon'}</button></div>`:''}
   ${!an.enBase&&!an.reco&&act?`<div class="row noprint"><button class="btn sec sm" data-act="${esc(an.cl.key)}">Désactiver (non justifiée)</button></div>`:''}`;
}
function renderTampon(){
  const el=$('#v-tampon'); const p=P();
  const list=[...R.analyses].sort((a,b)=>b.cl.km-a.cl.km);
  el.innerHTML = `<div class="card"><h2>Zones tampons stratégiques</h2>
   <p class="small">Méthode : les chantiers à moins de ${p.rayonCluster} km les uns des autres forment un secteur. Pour chaque secteur, deux organisations sont chiffrées sur la même période : <b>livraison directe</b> quotidienne depuis Bruay en utilitaire, et <b>plateforme relais</b> (navette porteur hebdomadaire vers un stock avancé + derniers kilomètres + double manutention + location du stockage, nulle si une base-vie existe). Une zone tampon n'est proposée que si les <b>trois critères</b> sont remplis : éloignement ≥ ${p.seuilKm} km, gain ≥ ${p.seuilGain} %, flux régulier.</p></div>
   ${list.map(an=>`<div class="card"><h2>${esc(an.cl.nom)} <span class="pill ${an.reco?'p-warn':'p-ok'}">${an.enBase?'Base':an.reco?'Tampon recommandé':'Direct'}</span></h2>${justif(an)}</div>`).join('')||'<div class="card mut">Aucun chantier localisé avec effectif.</div>'}
   <div class="card"><h2>Comparatif</h2><div class="tw"><table><thead><tr><th>Secteur</th><th class="num">km base</th><th class="num">Logts</th><th class="num">Direct</th><th class="num">Relais</th><th class="num">Écart</th><th>Décision</th></tr></thead><tbody>
   ${list.map(an=>`<tr><td>${esc(an.cl.nom)}</td><td class="num">${fmt(an.cl.km,1)}</td><td class="num">${an.nbLog}</td><td class="num">${eur(an.direct.cout)}</td><td class="num">${eur(an.relais.cout)}</td><td class="num" style="color:${an.gain>0?'var(--ok)':'var(--ko)'}">${an.gain>0?'+':''}${eur(an.gain)}</td><td>${an.enBase?'Base':an.reco?'<b>Tampon</b>':'Direct'}</td></tr>`).join('')}
   </tbody></table></div><p class="small mut">Hypothèses de coûts modifiables dans ⚙️ Données (€/km, €/h, capacités, location conteneur, seuils). Les distances sont estimées : corrigez le facteur routier si vous constatez un écart avec vos trajets réels.</p></div>`;
  bindAct(el);
}
function bindAct(el){ el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const k=b.dataset.act; const an=R.analyses.find(a=>a.cl.key===k); const cur=S.tampons[k];
  if(cur&&cur.actif){ cur.actif=false; } else { S.tampons[k]={actif:true,lieu:an.lieu.commune+(an.hasBV?' (base-vie)':''),lat:an.lieu.co.lat,lon:an.lieu.co.lon,date:todayISO()}; }
  save(); recompute(); toast(S.tampons[k].actif?'Zone tampon activée : tournées recalculées':'Zone tampon désactivée'); }); }

/* --- Alertes --- */
function renderAlertes(){
  const el=$('#v-alertes'); const A=R.alertes;
  el.innerHTML=`<div class="card"><h2>Alertes logistiques (${A.length})</h2>${A.map(a=>`<div class="al ${a.niv==='ko'?'ko':a.niv==='info'?'info':''}"><b>${a.niv==='ko'?'🔴':a.niv==='warn'?'🟠':'🔵'} ${esc(a.t)}</b><span class="small">${esc(a.d)}</span></div>`).join('')||'<p class="mut">Aucune alerte.</p>'}</div>`;
}

/* --- Données & paramètres --- */
function renderDonnees(){
  const el=$('#v-donnees'); const p=P();
  let imp='';
  if(IMPORT_TMP){ const {sh,hr,m}=IMPORT_TMP.cur; const heads=(sh.rows[hr]||[]).map(x=>x==null?'':String(x));
    const opt=sel=>`<option value="">—</option>`+heads.map((h,i)=>h?`<option value="${i}" ${sel===i?'selected':''}>${esc(h)}</option>`:'').join('');
    imp=`<div class="card" style="border-color:var(--acc)"><h2>Vérification de l'import : ${esc(IMPORT_TMP.file)}</h2>
     <div class="row"><label class="f">Feuille<select id="isheet">${IMPORT_TMP.sheets.map(s=>`<option ${s.name===sh.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><span class="small mut">Ligne d'en-tête détectée : ${hr+1} · ${Math.max(0,sh.rows.length-hr-1)} lignes</span></div>
     <h3>Champs logement</h3><div class="grid2">${FIELDS.map(f=>`<label class="f">${f.lib}<select data-mapf="${f.k}">${opt(m.fields[f.k])}</select></label>`).join('')}</div>
     <h3>Prestations (« non » = à faire · « oui » = fait · « DP » = attente diag)</h3><div class="grid2">${S.catalogue.map(c=>`<label class="f">${c.code} – ${esc(c.lib)}<select data-mapp="${c.code}">${opt(m.presta[c.code])}</select></label>`).join('')}</div>
     <div class="row" style="margin-top:10px"><button class="btn acc" id="iok">Valider l'import</button><button class="btn sec" id="icancel">Annuler</button></div>
     <p class="small mut">Les noms des locataires ne sont pas importés : seuls UG, adresse, commune, scénario, dates, diag et prestations sont lus.</p></div>`; }
  el.innerHTML = imp+`<div class="card"><h2>Source des logements</h2>
   <p class="small">Le module ne ressaisit rien : il relit l'export EVOLUD / Planning_EVOLUD (onglet Infos Dossiers) ou Chantier_evolud_2 (infos logt). Deux sources se complètent : le planning (logements, villes, dates) et les bons de commande Gamma (postes et quantités réelles, prioritaires pour composer les kits). Un nouvel import de planning remplace le précédent ; un import de BDC met à jour les logements qu'il contient ; stocks, commandes, kits préparés et zones tampons sont conservés (rattachés au n° UG).</p>
   <p>${S.source?`Dernier import : <b>${esc(S.source.fichier)}</b> · feuille ${esc(S.source.feuille)} · ${S.source.nb} logements · ${esc(S.source.date)}`:'<span class="mut">Aucun import.</span>'}</p>
   <p>${S.gammaSource?`Extraction Gamma : <b>${esc(S.gammaSource.fichier)}</b> · ${S.gammaSource.nb} logements (dates début / fin / VTS) · ${esc(S.gammaSource.date)}`:''}</p>
   <p>${S.mextSource?`Suivi MEXT : <b>${esc(S.mextSource.fichier)}</b> · ${S.mextSource.nb} logements commandés (dates de demande et de réception) · ${esc(S.mextSource.date)}`:''}</p>
   <p>${S.bdcSource?`Bons de commande Gamma : <b>${esc(S.bdcSource.fichier)}</b> · ${Object.keys(S.bdc).length} logements · ${esc(S.bdcSource.date)} <button class="btn sec sm" id="bdcclr">Retirer les données Gamma</button>`:'<span class="mut">Aucun bon de commande Gamma importé (export Evolud_bons_de_commande…csv) : les kits sont alors estimés depuis les prestations « non ».</span>'}</p>
   ${S.bdcSource&&Object.keys(S.bdcSource.nonReconnus||{}).length?`<details><summary>Articles Gamma non reconnus (${Object.keys(S.bdcSource.nonReconnus).length}) – non comptés dans les kits</summary><ul class="small">${Object.entries(S.bdcSource.nonReconnus).map(([a,n])=>`<li>${esc(a)} (${n})</li>`).join('')}</ul></details>`:''}
   <div class="row"><label class="btn">📥 Importer Excel / CSV<input type="file" id="ifile" accept=".xlsx,.xlsm,.csv" hidden></label><button class="btn sec" id="dexp">💾 Sauvegarde module (JSON)</button><label class="btn sec">♻️ Restaurer<input type="file" id="drest" accept=".json" hidden></label></div></div>

   <div class="card"><h2>Chantiers et villes d'intervention</h2><div class="tw"><table><thead><tr><th>Nom</th><th>Commune</th><th>Prog.</th><th>Statut</th><th class="num">Logts*</th><th>Début</th><th>Base-vie</th><th>Lat / Lon (si commune inconnue)</th><th></th></tr></thead><tbody>
   ${S.chantiers.map((c,i)=>`<tr><td><input data-ch="${i}" data-f="nom" value="${esc(c.nom)}" style="width:190px"></td><td><input data-ch="${i}" data-f="commune" value="${esc(c.commune)}" style="width:150px" list="dlc"></td><td><input data-ch="${i}" data-f="prog" value="${esc(c.prog)}" style="width:80px"></td>
     <td><select data-ch="${i}" data-f="statut"><option value="actif" ${c.statut==='actif'?'selected':''}>Actif</option><option value="futur" ${c.statut==='futur'?'selected':''}>Futur</option></select></td>
     <td class="num"><input type="number" data-ch="${i}" data-f="nb" value="${c.nb??''}" style="width:65px"></td><td><input type="date" data-ch="${i}" data-f="debut" value="${c.debut||''}"></td>
     <td><input type="checkbox" data-ch="${i}" data-f="baseVie" ${c.baseVie?'checked':''}></td><td><input data-ch="${i}" data-f="lat" value="${c.lat??''}" placeholder="lat" style="width:70px"> <input data-ch="${i}" data-f="lon" value="${c.lon??''}" placeholder="lon" style="width:70px"></td>
     <td><button class="btn sec sm" data-chdel="${i}">✕</button></td></tr>`).join('')}
   </tbody></table></div><datalist id="dlc">${COMMUNES.map(c=>`<option value="${esc(c[0])}">`).join('')}</datalist>
   <div class="row" style="margin-top:8px"><button class="btn sec sm" id="chadd">＋ Ajouter un chantier / une ville</button></div>
   <p class="small mut">* Effectif utilisé uniquement tant qu'aucun logement de ce chantier n'est importé. « Base-vie » = lieu de stockage déjà disponible (zone tampon sans loyer).</p></div>

   <div class="card"><h2>Hypothèses de calcul</h2><div class="grid2">
   ${[['facteurRoute','Facteur routier (× vol d\'oiseau)',0.05],['vitesse','Vitesse moyenne (km/h)',1],['coutKmVL','Coût utilitaire (€/km)',0.01],['capVL','Capacité utilitaire (m³)',1],['coutKmPL','Coût porteur navette (€/km)',0.01],['capPL','Capacité porteur (m³)',1],['coutHeure','Coût horaire chauffeur (€/h)',1],['tArret','Déchargement / arrêt (min)',1],['tChargeBase','Chargement au départ (min)',1],['manutKit','Manutention tampon / kit (min)',1],['coutStockMois','Location stockage tampon (€/mois)',10],['seuilKm','Seuil distance tampon (km)',1],['seuilGain','Seuil gain tampon (%)',1],['rayonCluster','Rayon de regroupement (km)',1],['jPrep','Livraison J- (jours ouvrés)',1],['horizon','Horizon analysé (semaines)',1],['cadenceDefaut','Cadence par défaut (logts/jour/chantier)',1],['volDefaut','Volume moyen kit si inconnu (m³)',0.1]]
     .map(([k,l,st])=>`<label class="f">${l}<input type="number" step="${st}" data-p="${k}" value="${p[k]}"></label>`).join('')}
   </div><div class="row" style="margin-top:8px"><label class="f">Base : nom<input data-pb="nom" value="${esc(p.base.nom)}" style="width:280px"></label><label class="f">lat<input data-pb="lat" value="${p.base.lat}" style="width:90px"></label><label class="f">lon<input data-pb="lon" value="${p.base.lon}" style="width:90px"></label><button class="btn sec sm" id="prst">Valeurs par défaut</button></div>
   <p class="small mut">Valeurs par défaut = ordres de grandeur du marché à confirmer avec vos coûts réels (parc, loueur, chauffeur). Elles conditionnent les recommandations de zones tampons.</p></div>

   <div class="card"><details><summary>Composition des kits par prestation (articles, quantités, volumes, délais)</summary>
   ${S.catalogue.map((c,ci)=>`<h3>${c.code} – ${esc(c.lib)} · ${esc(c.ent)} · <select data-cm="${ci}"><option value="kit" ${c.mode==='kit'?'selected':''}>Kit base</option><option value="surmesure" ${c.mode==='surmesure'?'selected':''}>Sur-mesure</option><option value="plateforme" ${c.mode==='plateforme'?'selected':''}>Plateforme</option><option value="cotraitant" ${c.mode==='cotraitant'?'selected':''}>Cotraitant</option></select> délai <input type="number" data-cd="${ci}" value="${c.delai}" style="width:60px"> j</h3>
     ${c.art.length?`<table><thead><tr><th>Article</th><th>Désignation</th><th class="num">Qté/logt</th><th class="num">m³/u</th><th class="num">kg/u</th></tr></thead><tbody>${c.art.map((a,ai)=>`<tr><td>${a.id}</td><td>${esc(a.des)}</td><td class="num"><input type="number" step="0.5" data-a="${ci}|${ai}|q" value="${a.q}" style="width:65px"></td><td class="num"><input type="number" step="0.005" data-a="${ci}|${ai}|v" value="${a.v}" style="width:75px"></td><td class="num"><input type="number" step="0.5" data-a="${ci}|${ai}|kg" value="${a.kg}" style="width:65px"></td></tr>`).join('')}</tbody></table>`:'<p class="small mut">Fourniture cotraitant : hors kit, apparaît dans les livraisons pour synchronisation.</p>'}`).join('')}
   <div class="row" style="margin-top:8px"><button class="btn sec sm" id="crst">Restaurer la composition par défaut</button></div></details></div>

   <div class="card"><h2>Intégration EVOLUD</h2><p class="small">Page autonome placée dans le même dépôt que l'appli (même adresse) : aucune dépendance externe, fonctionne sur le PC filtré et hors ligne. Clé de stockage propre : <code>${LS_KEY}</code> (n'écrit jamais dans les données de l'appli). Lien d'ouverture direct d'un logement : <code>logistique.html#ug=107494</code>. Interface de lecture pour l'appli : <code>window.EvoludLogistique</code> (getKits, getLivraisons, getAlertes, getTampons).</p></div>`;
  // liaisons
  const f=$('#ifile'); if(f) f.onchange=e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; };
  if(IMPORT_TMP){ $('#isheet').onchange=e=>selectImportSheet(e.target.value); $('#iok').onclick=applyImport; $('#icancel').onclick=()=>{IMPORT_TMP=null;renderDonnees();}; }
  const bc=$('#bdcclr'); if(bc) bc.onclick=()=>{ if(!confirm('Retirer les bons de commande et l\'extraction Gamma importés ?')) return; S.bdc={}; S.bdcSource=null; S.gamma={}; S.gammaSource=null; save(); recompute(); };
  $('#dexp').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); a.download='evolud_logistique_'+todayISO()+'.json'; a.click(); };
  $('#drest').onchange=async e=>{ const fl=e.target.files[0]; if(!fl) return; try{ const o=JSON.parse(await fl.text()); if(!o.params||!o.chantiers) throw 0; localStorage.setItem(LS_KEY,JSON.stringify(o)); S=load(); recompute(); toast('Sauvegarde restaurée'); }catch(_){ alert('Fichier de sauvegarde invalide'); } };
  el.querySelectorAll('[data-ch]').forEach(i=>i.onchange=()=>{ const c=S.chantiers[+i.dataset.ch], k=i.dataset.f; let v=i.type==='checkbox'?i.checked:i.value;
    if(k==='nb') v=v===''?null:+v; if((k==='lat'||k==='lon')) v=v===''?null:+String(v).replace(',','.'); c[k]=v;
    if(k==='commune' && !findCommune(v) && (c.lat==null||c.lon==null)) toast('Commune inconnue : saisissez lat / lon');
    save(); recompute(); });
  el.querySelectorAll('[data-chdel]').forEach(b=>b.onclick=()=>{ const c=S.chantiers[+b.dataset.chdel]; if(!confirm('Supprimer le chantier « '+c.nom+' » ?')) return; S.chantiers.splice(+b.dataset.chdel,1); save(); recompute(); });
  $('#chadd').onclick=()=>{ S.chantiers.push({id:'CH-'+Date.now(),nom:'Nouveau chantier',commune:'',prog:'',statut:'futur',nb:null,debut:'',fin:'',baseVie:false}); save(); recompute(); };
  el.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{ const v=+String(i.value).replace(',','.'); if(!isNaN(v)&&v>=0){ S.params[i.dataset.p]=v; save(); recompute(); } });
  el.querySelectorAll('[data-pb]').forEach(i=>i.onchange=()=>{ const k=i.dataset.pb; S.params.base[k]= k==='nom'?i.value:+String(i.value).replace(',','.'); save(); recompute(); });
  $('#prst').onclick=()=>{ if(!confirm('Remettre toutes les hypothèses par défaut ?')) return; S.params=structuredClone(DEF_PARAMS); save(); recompute(); };
  el.querySelectorAll('[data-cm]').forEach(s=>s.onchange=()=>{ S.catalogue[+s.dataset.cm].mode=s.value; save(); recompute(); });
  el.querySelectorAll('[data-cd]').forEach(s=>s.onchange=()=>{ S.catalogue[+s.dataset.cd].delai=Math.max(0,+s.value||0); save(); recompute(); });
  el.querySelectorAll('[data-a]').forEach(s=>s.onchange=()=>{ const [ci,ai,k]=s.dataset.a.split('|'); S.catalogue[+ci].art[+ai][k]=Math.max(0,+s.value||0); save(); recompute(); });
  $('#crst').onclick=()=>{ if(!confirm('Restaurer la composition des kits par défaut ?')) return; S.catalogue=structuredClone(DEF_CATALOGUE); save(); recompute(); };
}

/* ---------- API d'intégration (lecture seule) ---------- */
window.EvoludLogistique = {
  version:'1.3',
  getKits:()=>R.kits.map(k=>({ug:k.l.ug,source:k.k.src,commune:k.l.commune,debut:k.l.debut,statut:k.status,volume:+k.k.vol.toFixed(3),poids:Math.round(k.k.kg),bloquants:[...k.wait,...k.miss.map(m=>'Manque '+m.id)]})),
  getLivraisons:()=>R.tournees.map(t=>({date:t.date,type:t.type,itineraire:t.stops.map(s=>s.nom),logements:t.items.map(i=>i.kt.l.ug),km:+t.km.toFixed(1),cout:Math.round(t.cout)})),
  getAlertes:()=>R.alertes.slice(),
  getTampons:()=>R.analyses.map(a=>({secteur:a.cl.nom,km:+a.cl.km.toFixed(1),recommande:a.reco,actif:!!(S.tampons[a.cl.key]||{}).actif,gain:Math.round(a.gain),gainPct:+a.gainPct.toFixed(1)}))
};

/* ---------- Démarrage ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
recompute();
(function(){ const m=/ug=([^&]+)/.exec(location.hash); if(m){ KF.q=decodeURIComponent(m[1]); show('kits'); } })();
</script>
